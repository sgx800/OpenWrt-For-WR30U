name: WR30U
run-name: WR30U - ${{ inputs.TEST && 'configuration only' || 'full firmware' }}

# Weekly scheduled build: Monday 05:00 Asia/Shanghai (Sunday 21:00 UTC).
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      TEST:
        description: 'Only resolve and verify configuration (leave checked unless explicitly building firmware)'
        type: boolean
        required: true
        default: true

permissions:
  actions: write
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: wr30u-vendor
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  CCACHE_MAXSIZE: 1G
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete historical Workflow Runs
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          workflows_keep_day: 0

  build:
    needs: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.TEST && 30 || 360 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Static checks
        run: |
          mkdir -p output logs
          bash -n Scripts/packages.sh
          python3 -m unittest discover -s tests -v 2>&1 | tee logs/static.log
      - name: Install build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Only unused SDKs on this disposable GitHub-hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ccache \
            libelf-dev libgmp-dev libmpc-dev libmpfr-dev device-tree-compiler \
            cmake ninja-build autoconf automake libtool gperf help2man texinfo \
            zstd pkgconf jq bzip2 patch time xsltproc libxml-parser-perl libfuse-dev \
            cpio xz-utils python3-ply python3-docutils libreadline-dev libglib2.0-dev \
            libgnutls28-dev autopoint intltool lld llvm libltdl-dev
          sudo apt-get clean
          FREE_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$FREE_KB" -lt 26214400 ]; then
            echo "At least 25 GiB free space required; available: $FREE_KB KiB" >&2
            exit 1
          fi
          df -h
      - name: Fetch padavanonly source and verify Vendor backend
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" wrt
          echo "SOURCE_SHA=$(git -C wrt rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            printf 'recipe_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_repo=%s\nsource_branch=%s\nsource_commit=%s\n' \
              "$SOURCE_REPO" "$SOURCE_BRANCH" "$(git -C wrt rev-parse HEAD)"
          } > output/source-lock.txt
          python3 Scripts/recipe.py source wrt 2>&1 | tee logs/source-check.log
      - name: Update matching feeds and selected applications
        run: |
          (cd wrt && ./scripts/feeds update -a) 2>&1 | tee logs/feeds-update.log
          (cd wrt && ./scripts/feeds install -a) 2>&1 | tee logs/feeds-install.log
          bash Scripts/packages.sh wrt 2>&1 | tee logs/packages.log
          for feed in wrt/feeds/*; do
            if [ -e "$feed/.git" ]; then
              printf 'feed_%s=%s\n' "${feed##*/}" "$(git -C "$feed" rev-parse HEAD)"
            fi
          done >> output/source-lock.txt
      - name: Resolve configuration and check WR30U Vendor policy
        run: |
          python3 Scripts/recipe.py compose wrt > wrt/.config
          cp wrt/.config output/requested.config
          status=0
          make -C wrt defconfig 2>&1 | tee logs/defconfig.log || status=$?
          # Save evidence BEFORE running any assertion, also on failure.
          test ! -f wrt/.config || cp wrt/.config output/resolved.config
          test ! -f wrt/tmp/.packageinfo || cp wrt/tmp/.packageinfo output/packageinfo.txt
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          (cd wrt && ./scripts/diffconfig.sh) > output/diffconfig.txt
          python3 Scripts/recipe.py config wrt 2>&1 | tee logs/config-check.log
          git -C wrt diff --exit-code -- target/linux package/kernel package/mtk \
            include config scripts feeds.conf.default
      - name: Cache compiler objects only
        if: ${{ !inputs.TEST }}
        uses: actions/cache@v6.1.0
        with:
          path: wrt/.ccache
          key: wr30u-vendor-u24-${{ hashFiles('Config/**', 'Scripts/**') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            wr30u-vendor-u24-${{ hashFiles('Config/**', 'Scripts/**') }}-
      - name: Download package sources
        if: ${{ !inputs.TEST }}
        run: |
          make -C wrt download -j"$(nproc)" 2>&1 | tee logs/download.log
      - name: Compile firmware (one manual request)
        if: ${{ !inputs.TEST }}
        run: |
          make -C wrt -j"$(nproc)" 2>&1 | tee logs/build.log || \
            make -C wrt -j1 V=s 2>&1 | tee logs/build-retry.log
      - name: Check and collect WR30U firmware
        if: ${{ !inputs.TEST }}
        run: |
          python3 Scripts/recipe.py config wrt
          git -C wrt diff --exit-code -- target/linux package/kernel package/mtk \
            include config scripts feeds.conf.default
          python3 Scripts/recipe.py collect wrt --output output
      - name: Prepare release metadata
        if: ${{ !inputs.TEST }}
        run: |
          RELEASE_DATE="$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M%S')"
          RELEASE_TITLE_DATE="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          echo "RELEASE_TAG=WR30U-$RELEASE_DATE" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=WR30U MTK Vendor · $RELEASE_TITLE_DATE" >> "$GITHUB_ENV"

          MANIFEST="$(find output -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          KERNEL="$(awk '$1=="kernel" && $2=="-" {print $3; exit}' "$MANIFEST")"
          {
            echo "## Xiaomi WR30U · MTK Vendor Wi-Fi"
            echo
            echo "- 设备：Xiaomi WR30U stock"
            echo "- 无线：MTK Vendor mt_wifi / MT7981"
            echo "- 源码：padavanonly/immortalwrt-mt798x-6.6"
            echo "- 分支：$SOURCE_BRANCH"
            echo "- 源码提交：$SOURCE_SHA"
            echo "- 配置提交：$GITHUB_SHA"
            echo "- 内核：$KERNEL"
            echo "- Actions Run：$GITHUB_RUN_ID"
            echo
            echo "### LuCI 应用 / 主题"
            awk '$1 ~ /^luci-(app|theme)-/ {print "- " $1}' "$MANIFEST" | sort -u
            echo
            echo "### Firmware SHA256"
            echo '```text'
            cat output/firmware-sha256sums
            echo '```'
          } > output/RELEASE.md

      - name: Publish firmware release
        if: ${{ !inputs.TEST }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: output/RELEASE.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            output/*-sysupgrade.bin
            output/*.manifest
            output/firmware-sha256sums
            output/*.buildinfo

      - name: Keep only the latest 3 releases
        if: ${{ !inputs.TEST }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t OLD_TAGS < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[3:] | .[].tagName'
          )
          for TAG in "${OLD_TAGS[@]}"; do
            [ -n "$TAG" ] || continue
            echo "Deleting old release and tag: $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

      - name: Upload results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wr30u-vendor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
