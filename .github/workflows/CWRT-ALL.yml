# Based on VIKINGYFY/CloseWRT-CI 5398107bb0ad5df8f74e128c2f7c5af1b03b3b89.
name: WR30U

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Config/**'
      - 'Scripts/**'
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      TEST:
        description: 'Generate and validate configuration only; do not compile firmware.'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: wr30u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Check local scripts and configuration guard
        run: |
          set -euo pipefail
          find Scripts -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          python3 Scripts/wr30u-config.py self-test
  build:
    needs: preflight
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: WR30U
      WRT_THEME: aurora
      WRT_NAME: CWRT
      WRT_SSID: CWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.31.1
      WRT_PW: 'No default password'
      WRT_REPO: https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly.git
      WRT_BRANCH: openwrt-24.10-6.6
      WRT_SOURCE: Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly
      WRT_PACKAGE: ''
      WRT_TEST: ${{ inputs.TEST || false }}
