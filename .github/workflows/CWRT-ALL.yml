name: WR30U Native

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: 'Configuration validation only; do not build a firmware image.'
        type: boolean
        default: false
        required: false
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: wr30u-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: mt798x-mt799x-6.6-mtwifi

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Static recipe tests
        run: |
          bash -n Scripts/packages.sh
          python3 -m unittest discover -s tests -v
  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p output logs
          # Reclaim unused SDKs on the disposable GitHub-hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ccache \
            libelf-dev libgmp-dev libmpc-dev libmpfr-dev device-tree-compiler \
            cmake ninja-build autoconf automake libtool gperf help2man texinfo \
            zstd pkgconf jq bzip2 patch time xsltproc libxml-parser-perl libfuse-dev \
            cpio xz-utils python3-ply python3-docutils libreadline-dev libglib2.0-dev \
            libgnutls28-dev autopoint intltool lld llvm libltdl-dev
          sudo apt-get clean
          FREE_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$FREE_KB" -lt 26214400 ]; then
            echo "At least 25 GiB free disk space is required; available: $FREE_KB KiB" >&2
            exit 1
          fi
          df -h
      - name: Fetch the exact requested source branch
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" wrt
          python3 Scripts/native.py source wrt
          echo "SOURCE_SHA=$(git -C wrt rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            printf 'recipe_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_repo=%s\nsource_branch=%s\nsource_commit=%s\n' \
              "$SOURCE_REPO" "$SOURCE_BRANCH" "$(git -C wrt rev-parse HEAD)"
          } > output/source-lock.txt
      - name: Update native feeds and add selected applications
        run: |
          cd wrt
          ./scripts/feeds update -a 2>&1 | tee ../logs/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ../logs/feeds-install.log
          cd ..
          bash Scripts/packages.sh wrt 2>&1 | tee logs/custom-packages.log
          for feed in wrt/feeds/*; do
            if [ -d "$feed/.git" ]; then
              printf 'feed_%s=%s\n' "${feed##*/}" "$(git -C "$feed" rev-parse HEAD)"
            fi
          done >> output/source-lock.txt
      - name: Resolve and verify the native WR30U configuration
        run: |
          cat Config/WR30U.config Config/plugins.config > wrt/.config
          make -C wrt defconfig 2>&1 | tee logs/defconfig.log
          python3 Scripts/native.py config wrt
          cp wrt/.config output/resolved.config
          (cd wrt && ./scripts/diffconfig.sh) > output/diffconfig.txt
          git -C wrt diff --exit-code -- target/linux package/kernel package/mtk \
            include config scripts feeds.conf.default
      - name: Cache compiler objects only
        if: ${{ !inputs.TEST }}
        uses: actions/cache@v6
        with:
          path: wrt/.ccache
          key: native-wr30u-ubuntu24-${{ hashFiles('Config/*.config', 'Scripts/**') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            native-wr30u-ubuntu24-${{ hashFiles('Config/*.config', 'Scripts/**') }}-
      - name: Download package sources
        if: ${{ !inputs.TEST }}
        run: |
          make -C wrt download -j"$(nproc)" 2>&1 | tee logs/download.log
      - name: Compile the native firmware
        if: ${{ !inputs.TEST }}
        run: |
          make -C wrt -j"$(nproc)" 2>&1 | tee logs/build.log || \
            make -C wrt -j1 V=s 2>&1 | tee logs/build-retry.log
      - name: Verify image and package manifest
        if: ${{ !inputs.TEST }}
        run: |
          python3 Scripts/native.py config wrt
          python3 Scripts/native.py collect wrt --output output
          git -C wrt diff --exit-code -- target/linux package/kernel package/mtk \
            include config scripts feeds.conf.default
      - name: Upload firmware or diagnostic files
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wr30u-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 14
